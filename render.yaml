services:
  - type: web
    name: specmatch
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: python -m pip install --upgrade pip && python -m pip install --only-binary=:all: -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free
      - key: DATASET_VERSION
        value: V0.4
      - key: STANDARDS_COUNT
        value: 24,132
      - key: DEBUG
        value: "false"